name: Daten aktualisieren und GitHub Pages veröffentlichen

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hbd-pages
  cancel-in-progress: false

env:
  TZ: Europe/Berlin
  HANDBALL_USER_AGENT: HBD-Loewen-Live/1.0 (GitHub Pages cache fetcher)
  REQUEST_DELAY_MS: "800"
  FETCH_TIMEOUT_MS: "20000"
  COMPUTE_STANDINGS_FROM_PHASE: "false"

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: hbd-loewen-live-cache

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ausgangsprojekt testen
        run: npm test

      - name: Öffentliche Daten in JSON-Cache laden
        id: fetch
        continue-on-error: true
        run: npm run fetch

      - name: Cache und Cache-only-Frontend prüfen
        run: |
          npm run check
          npm test
          npm run build

      - name: Erfolgreichen Cache im Repository sichern
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/*.json

          if ! git diff --cached --quiet; then
            git commit -m "data: Cache automatisch aktualisieren"
            git push
          fi

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Statische App hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: hbd-loewen-live-cache/dist

      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
