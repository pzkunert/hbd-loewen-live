<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070a12">
  <meta name="description" content="Live-Spiele, Spielplan und Tabellen der HBD Löwen Oberberg.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="preconnect" href=".">
  <link rel="stylesheet" href="styles.css">
  <title>HBD Löwen Live</title>
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <div class="brand-row">
        <div class="mark" aria-hidden="true"><span>L</span></div>
        <div>
          <p class="eyebrow">HBD LÖWEN OBERBERG</p>
          <h1>Löwen Live</h1>
        </div>
        <button class="icon-button" id="refreshButton" aria-label="Gecachte Daten neu laden" title="Neu laden">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5M6.1 9A7 7 0 0 1 18 6.6L20 9M4 15l2 2.4A7 7 0 0 0 17.9 15"/></svg>
        </button>
      </div>
      <div class="status-line">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Cache wird geladen …</span>
        <span class="status-time" id="statusTime"></span>
      </div>
      <label class="team-picker">
        <span>Mannschaft</span>
        <select id="teamSelect" aria-label="Mannschaft auswählen">
          <option value="all">Alle Löwen-Teams</option>
        </select>
      </label>
    </header>

    <main id="main" tabindex="-1">
      <section class="view active" id="homeView" data-view="home" aria-labelledby="homeHeading">
        <h2 class="sr-only" id="homeHeading">Live und Übersicht</h2>
        <div id="notice"></div>
        <section class="section live-section">
          <div class="section-heading">
            <div><span class="kicker live-kicker"><i></i> LIVE</span><h2>Jetzt auf der Platte</h2></div>
            <span class="count-pill" id="liveCount">0</span>
          </div>
          <div id="liveMatches" class="stack"></div>
        </section>
        <section class="section">
          <div class="section-heading"><div><span class="kicker">ALS NÄCHSTES</span><h2>Nächstes Spiel</h2></div></div>
          <div id="nextMatch" class="stack"></div>
        </section>
        <section class="section">
          <div class="section-heading"><div><span class="kicker">ABGEPFIFFEN</span><h2>Letztes Ergebnis</h2></div></div>
          <div id="lastResult" class="stack"></div>
        </section>
      </section>

      <section class="view" id="gamesView" data-view="games" aria-labelledby="gamesHeading">
        <div class="page-heading"><span class="kicker">SAISON</span><h2 id="gamesHeading">Spiele</h2></div>
        <div class="filters" id="gameFilters" role="group" aria-label="Spiele filtern">
          <button class="filter active" data-filter="all">Alle</button>
          <button class="filter" data-filter="live">Live</button>
          <button class="filter" data-filter="upcoming">Kommende</button>
          <button class="filter" data-filter="results">Ergebnisse</button>
        </div>
        <div id="gamesList" class="stack games-list"></div>
      </section>

      <section class="view" id="tableView" data-view="table" aria-labelledby="tableHeading">
        <div class="page-heading"><span class="kicker">WETTBEWERB</span><h2 id="tableHeading">Tabelle</h2></div>
        <label class="phase-picker"><span>Staffel</span><select id="phaseSelect" aria-label="Staffel auswählen"></select></label>
        <div id="standings" class="table-card"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Hauptnavigation">
      <button class="nav-item active" data-target="home" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 10v10h13V10M9.5 20v-6h5v6"/></svg><span>Live</span>
      </button>
      <button class="nav-item" data-target="games">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4m8-4v4M3 10h18"/></svg><span>Spiele</span>
      </button>
      <button class="nav-item" data-target="table">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10h4v10M10 20V4h4v16M15 20v-7h4v7M3 20h18"/></svg><span>Tabelle</span>
      </button>
    </nav>
  </div>
  <noscript>Für die Darstellung der gecachten Spieldaten wird JavaScript benötigt.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
